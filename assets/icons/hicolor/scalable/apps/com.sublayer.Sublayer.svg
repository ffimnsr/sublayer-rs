<?xml version="1.0" encoding="UTF-8"?>
<!-- Sublayer app icon: caption bars over the studio's dark panel color. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f81ff"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#12151d"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#2b3446" stroke-width="8"/>
  <!-- Caption bars: one highlighted word, two plain words. -->
  <rect x="112" y="176" width="128" height="56" rx="28" fill="url(#accent)"/>
  <rect x="268" y="176" width="132" height="56" rx="28" fill="#e9edf5"/>
  <rect x="112" y="268" width="184" height="56" rx="28" fill="#e9edf5"/>
  <rect x="324" y="268" width="76" height="56" rx="28" fill="#e9edf5" opacity="0.55"/>
  <!-- Waveform hint under the caption. -->
  <g fill="#3fbfb1" opacity="0.9">
    <rect x="112" y="372" width="12" height="24" rx="6"/>
    <rect x="136" y="360" width="12" height="48" rx="6"/>
    <rect x="160" y="376" width="12" height="16" rx="6"/>
    <rect x="184" y="352" width="12" height="64" rx="6"/>
    <rect x="208" y="368" width="12" height="32" rx="6"/>
    <rect x="232" y="380" width="12" height="8" rx="4"/>
    <rect x="256" y="356" width="12" height="56" rx="6"/>
    <rect x="280" y="372" width="12" height="24" rx="6"/>
    <rect x="304" y="364" width="12" height="40" rx="6"/>
    <rect x="328" y="380" width="12" height="8" rx="4"/>
    <rect x="352" y="368" width="12" height="32" rx="6"/>
    <rect x="376" y="378" width="12" height="12" rx="6"/>
  </g>
</svg>
