[package]
name = "sublayer-ai"
description = "Whisper transcription, model management, and voice activity detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sublayer-core.workspace = true
hound.workspace = true
reqwest.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
whisper-rs = "0.16"

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
# Compiles whisper.cpp with the Vulkan backend; requires the Vulkan SDK
# (headers + glslc/glslangValidator + cmake) at build time. Without it,
# whisper-rs runs on CPU even when `TranscriberConfig::use_gpu` is set.
vulkan = ["whisper-rs/vulkan"]

[lints]
workspace = true