[package]
name = "sublayer-ai"
description = "Whisper transcription, model management, and voice activity detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sublayer-core.workspace = true
sublayer-whisper.workspace = true
hound.workspace = true
reqwest.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
# Compiles whisper.cpp's Vulkan backend through sublayer-whisper; requires the
# Vulkan SDK (headers + glslc/glslangValidator + cmake) at build time. Without
# it, whisper-runs on CPU even when `TranscriberConfig::use_gpu` is set.
vulkan = ["sublayer-whisper/vulkan"]

[lints]
workspace = true