[package]
name = "sublayer-player"
description = "Slint live-caption media player with automatic language detection and live translation"
version.workspace = true
edition.workspace = true
# Slint 1.18 requires a newer toolchain than the rest of the workspace.
rust-version = "1.92"
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sublayer-player"
path = "src/main.rs"

[dependencies]
sublayer-core.workspace = true
sublayer-media.workspace = true
sublayer-ai.workspace = true
sublayer-translate = { workspace = true, features = ["local-translate", "download"] }
slint.workspace = true
# Audio goes through a system helper resolved at runtime (pw-cat / paplay /
# aplay), so the build needs no host audio dev headers.
which.workspace = true
crossbeam-channel.workspace = true
rfd.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
# Headless platform for instantiating the window in tests.
i-slint-backend-testing = "1.18"
tempfile.workspace = true

[features]
default = []
# Forward the opt-in GPU backend for whisper; see sublayer-ai.
vulkan = ["sublayer-ai/vulkan"]

[lints]
workspace = true