[package]
name = "sublayer-ui"
description = "Slint desktop caption studio for Sublayer"
version.workspace = true
edition.workspace = true
# Slint 1.18 requires a newer toolchain than the rest of the workspace.
rust-version = "1.92"
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sublayer-ui"
path = "src/main.rs"

[dependencies]
sublayer-core.workspace = true
sublayer-media.workspace = true
sublayer-ai.workspace = true
sublayer-subtitles.workspace = true
sublayer-export.workspace = true
# Slint's runtime font registration (fontique) mirrors the bundled fonts the
# render burns, so the preview measures and centers words with the same face.
slint = { workspace = true, features = ["unstable-fontique-011"] }
crossbeam-channel.workspace = true
rfd.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
# Headless platform for instantiating the window in tests.
i-slint-backend-testing = "1.18"

[features]
# Forward the opt-in Vulkan encode backend; see sublayer-export.
default = []
encode_vulkan = ["sublayer-export/encode_vulkan"]

[lints]
workspace = true
