[package]
name = "sublayer-cli"
description = "Headless command-line tool for transcription, probing, and rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sublayer"
path = "src/main.rs"

[dependencies]
sublayer-core.workspace = true
sublayer-media.workspace = true
sublayer-ai.workspace = true
sublayer-subtitles.workspace = true
sublayer-export.workspace = true
clap.workspace = true
indicatif.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[features]
# Forward the opt-in Vulkan encode backend; see sublayer-export.
default = []
encode_vulkan = ["sublayer-export/encode_vulkan"]

[lints]
workspace = true